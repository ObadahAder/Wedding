:root{
  --violet:#9470c4; --violet-deep:#6a4a93;
  --coral:#e2796f; --cream:#fef2e9; --ink:#5b4a6b;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#efe6f6}
body{
  font-family:'Thmanyah Sans',system-ui,sans-serif;
  color:var(--ink);line-height:1.9;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
.sheet{max-width:520px;margin:0 auto;background:var(--cream);box-shadow:0 0 50px rgba(106,74,147,.12)}

/* ===== الدعوة كصورة ===== */
.invite{display:block;width:100%;height:auto}
/* يظهر هذا فقط لو لم تُضف الصورة بعد */
.invite-missing{
  padding:80px 24px;text-align:center;color:var(--violet-deep);
  background:linear-gradient(180deg,#e9ddf2,#f6ecdd);
}
.invite-missing b{display:block;font-size:19px;margin-bottom:8px}
.invite-missing span{font-size:14px;opacity:.75}

/* ===== بطاقة تأكيد الحضور تحت قسم الدعوة الخاصة ===== */
.rsvp-band{
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(226,121,111,.16), transparent 60%),
    linear-gradient(180deg,var(--cream) 0%, #f7e6d8 100%);
  padding:40px 26px 46px;text-align:center;
}
.rsvp-band .kicker{color:var(--coral);font-weight:700;letter-spacing:.04em;font-size:15px}
.rsvp-band h2{color:var(--violet-deep);font-weight:700;font-size:26px;margin:6px 0 4px}
.rsvp-band .lead{color:var(--ink);font-size:15px;opacity:.85;margin-bottom:22px}

.rsvp{max-width:340px;margin:0 auto}
.rsvp input{
  width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid rgba(148,112,196,.4);
  background:#fff;font-family:inherit;font-size:17px;color:var(--ink);text-align:center;
}
.rsvp input::placeholder{color:#b9a9cf}
.rsvp input:focus{outline:none;border-color:var(--violet)}
.rsvp button{
  width:100%;margin-top:12px;padding:16px;border:none;border-radius:14px;cursor:pointer;
  background:var(--violet);color:#fff;font-family:inherit;font-weight:700;font-size:18px;
  transition:background .2s,transform .1s;
}
.rsvp button:hover{background:var(--violet-deep)}
.rsvp button:active{transform:scale(.99)}
.rsvp button:disabled{opacity:.6;cursor:default}

.msg{max-width:340px;margin:18px auto 0;padding:20px;border-radius:16px;font-size:16px;line-height:2;display:none}
.msg.ok{display:block;background:rgba(148,112,196,.12);color:var(--violet-deep);border:1px solid rgba(148,112,196,.35)}
.msg.err{display:block;background:rgba(200,80,80,.1);color:#9a3b3b;border:1px solid rgba(200,80,80,.3)}
.msg .big{display:block;font-weight:700;font-size:21px;color:var(--violet);margin-bottom:6px}

.foot{text-align:center;padding:20px;color:var(--violet-deep);opacity:.6;font-size:13px;background:#f7e6d8}
</style>
</head>
<body>
<div class="sheet">

  <!-- ضعي صورة الدعوة المصدّرة من Illustrator باسم invitation.jpg بجانب هذا الملف -->
  <img class="invite" src="invitation.jpg" alt="دعوة حفل زفاف عُبادة و حَنان"
       onerror="this.style.display='none';document.getElementById('imgmiss').style.display='block'">
  <div class="invite-missing" id="imgmiss" style="display:none">
    <b>مكان صورة الدعوة</b>
    <span>أضيفي ملف invitation.jpg بجانب الصفحة</span>
  </div>

  <!-- تأكيد الحضور -->
  <div class="rsvp-band">
    <div class="kicker">تأكيد الحضور</div>
    <h2>يسعدنا تأكيد حضوركِ</h2>
    <div class="lead">اكتبي اسمكِ وسنرسل كود الدخول عبر الواتساب</div>

    <div class="rsvp" id="rsvpBox">
      <input id="guestName" type="text" autocomplete="name" placeholder="الاسم الكامل">
      <button id="rsvpBtn">تأكيد الحضور</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">نتشرّف بحضوركِ ومشاركتنا الفرحة</div>
</div>

<script>
/* ===== ضعي رابط الـ Web App من Google Apps Script هنا ===== */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwB94qza26sP99rg8WOJ38poLoUJ8FtvtFOOr2_StjLrlQG2bJQ2v5W5DMdUoikCICZ/exec";
/* ========================================================= */

const btn=document.getElementById('rsvpBtn');
const input=document.getElementById('guestName');
const box=document.getElementById('rsvpBox');
const msg=document.getElementById('msg');
function show(t,h){msg.className='msg '+t;msg.innerHTML=h;}
btn.addEventListener('click',submit);
input.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
async function submit(){
  const name=input.value.trim();
  if(name.length<2){input.focus();input.style.borderColor='#c25555';return;}
  btn.disabled=true;btn.textContent='جاري الإرسال...';
  try{
    await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name})});
    box.style.display='none';
    show('ok','<span class="big">تم الحجز ✓</span>سيتم إرسال الكود الخاص بكِ للدخول للحفلة عن طريق الواتساب');
  }catch(err){
    btn.disabled=false;btn.textContent='تأكيد الحضور';
    show('err','تعذّر الإرسال، تأكدي من الاتصال بالإنترنت وحاولي مرة أخرى.');
  }
}
</script>
</body>
</html>
