*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e9ddf2}
body{overflow-x:hidden}
.stage{position:relative;max-width:560px;margin:0 auto;opacity:0;transform:scale(1.03);
  transform-origin:50% 26%;transition:opacity 1.3s ease, transform 1.8s cubic-bezier(.2,.7,.2,1)}
.stage.loaded{opacity:1;transform:scale(1)}
.stage svg{display:block;width:100%;height:auto}

/* RSVP overlays on the drawn boxes */
.ov-input{position:absolute;left:40.79%;top:79.00%;width:41.71%;height:2.40%;
  border:none;background:transparent;outline:none;text-align:center;
  font-family:'Sans';font-weight:500;color:#6a4a93;line-height:1;padding:0;z-index:5}
.ov-input::placeholder{color:rgba(106,74,147,.4);font-weight:400}
.ov-btn{position:absolute;left:18.03%;top:78.97%;width:20.66%;height:2.47%;
  border:none;background:transparent;cursor:pointer;color:#fff;font-family:'Sans';font-weight:500;
  line-height:1;display:flex;align-items:center;justify-content:center;z-index:5;
  -webkit-tap-highlight-color:transparent}
.ov-btn:active{background:rgba(255,255,255,.14);border-radius:12px}
.ov-btn:disabled{cursor:default}
.ov-msg{position:absolute;left:16%;top:78.3%;width:68%;display:none;text-align:center;line-height:1.7;
  padding:14px 16px;border-radius:16px;font-family:'Sans';z-index:6;backdrop-filter:blur(6px)}
.ov-msg.ok{display:block;background:rgba(255,255,255,.85);color:#6a4a93;border:1px solid rgba(148,112,196,.4);
  box-shadow:0 6px 20px rgba(106,74,147,.18)}
.ov-msg.err{display:block;background:rgba(255,245,245,.9);color:#9a3b3b;border:1px solid rgba(200,80,80,.4)}
.ov-msg .big{display:block;font-weight:500;color:#9470c4;margin-bottom:4px}

@media (prefers-reduced-motion: reduce){ .stage{opacity:1;transform:none;transition:none} }

<input class="ov-input" id="guestName" type="text" autocomplete="name" aria-label="الاسم" placeholder="اكتبي اسمكِ">
<button class="ov-btn" id="rsvpBtn" aria-label="تأكيد الحضور">ارسل</button>
<div class="ov-msg" id="msg"></div>
</div>

<script>
/* ---- reveal + load zoom ---- */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function run(){
    var stage=document.getElementById('stage'); stage.classList.add('loaded');
    sizeRsvp();
    if(reduce) return;
    var svg=stage.querySelector('svg'); if(!svg) return;
    var total=stage.getBoundingClientRect().height||1;
    var nodes=[].slice.call(svg.querySelectorAll('path,image,polygon,polyline,circle,ellipse,rect,use'))
                 .filter(function(e){return !e.closest('defs');});
    var items=[];
    nodes.forEach(function(e){
      var r; try{r=e.getBoundingClientRect();}catch(x){return;}
      if(r.width<=0||r.height<=0) return;
      if(r.height>total*0.5) return;
      e.style.opacity='0'; e.style.transition='opacity .9s ease'; items.push(e);
    });
    function check(){
      var vh=window.innerHeight||800;
      for(var i=0;i<items.length;i++){
        var e=items[i]; if(e.getAttribute('data-rv')) continue;
        var r=e.getBoundingClientRect();
        if(r.top<vh*0.92 && r.bottom>-60){ e.style.opacity='1'; e.setAttribute('data-rv','1'); }
      }
    }
    check();
    window.addEventListener('scroll',function(){requestAnimationFrame(check);},{passive:true});
    window.addEventListener('resize',check);
    setTimeout(function(){items.forEach(function(e){e.style.opacity='1';});},4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();

/* ---- RSVP text sizing (matches the design's body text) ---- */
var stage=document.getElementById('stage');
var input=document.getElementById('guestName');
var btn=document.getElementById('rsvpBtn');
var msg=document.getElementById('msg');
function sizeRsvp(){ var fs=(stage.clientWidth*42/1920)+'px'; input.style.fontSize=fs; btn.style.fontSize=fs; msg.style.fontSize=fs; }
window.addEventListener('resize',sizeRsvp); window.addEventListener('load',sizeRsvp);

/* ---- RSVP submit ---- */
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbx4KN-Gu__aCLpveVt4Hc4q_4IZROXmQB9DnD5k9Ov439Xk1GgE1ksw-xLL_d0GBPKn/exec";
function show(t,h){ msg.className='ov-msg '+t; msg.innerHTML=h; }
btn.addEventListener('click',submit);
input.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
async function submit(){
  var name=input.value.trim();
  if(name.length<2){ input.focus(); return; }
  btn.disabled=true; input.disabled=true;
  try{
    await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:name})});
    input.style.display='none'; btn.style.display='none';
    show('ok','<span class="big">شكراً لكِ على التأكيد</span>سيصلكِ رمز الدخول للحفل قريباً');
  }catch(e){
    btn.disabled=false; input.disabled=false;
    show('err','تعذّر الإرسال، تأكدي من الاتصال وحاولي مرة أخرى.');
  }
}
</script>
