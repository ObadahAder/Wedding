function sizeText(){
  // match the invitation's own body text, scaled to however wide it renders
  const fs=(frame.clientWidth*BODY_PX/DESIGN_W)+'px';
  input.style.fontSize=fs;   // typed name + placeholder
  btn.style.fontSize=fs;     // ارسل
  msg.style.fontSize=fs;     // confirmation message
}
window.addEventListener('resize',sizeText);
window.addEventListener('load',sizeText);
if(document.readyState!=='loading') sizeText();
function show(type,html){ msg.className='ov-msg '+type; msg.innerHTML=html; }
btn.addEventListener('click',submit);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
async function submit(){
  const name=input.value.trim();
  if(name.length<2){ input.focus(); return; }
  btn.disabled=true; input.disabled=true;
  try{
    await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name})});
    input.style.display='none'; btn.style.display='none';
    show('ok','<span class="big">شكراً لكِ على التأكيد</span>سيصلكِ رمز الدخول للحفل قريباً');
  }catch(err){
    btn.disabled=false; input.disabled=false;
    show('err','تعذّر الإرسال، تأكدي من الاتصال وحاولي مرة أخرى.');
  }
}
</script>
</body>
</html>
